<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus form</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; background: #ffffff; color: #14161c; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .page { padding: 28px 32px 40px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
  .hint { color: #6b7280; font-size: 13px; margin: 0 0 22px; max-width: 60ch; }
  label { display: block; font-size: 12px; font-weight: 600; color: #4b5263;
          letter-spacing: .04em; text-transform: uppercase; margin: 0 0 6px; }
  input[type=text], input[type=email] {
    display: block; box-sizing: border-box; width: min(640px, 88%);
    font: inherit; font-size: 24px; line-height: 1.2; padding: 14px 16px;
    margin: 0 0 20px; color: #14161c; background: #ffffff;
    border: 2px solid #c9cedb; border-radius: 8px;
  }
  input:focus { outline: 3px solid #5b6cff; outline-offset: 1px; border-color: #5b6cff; }
  button { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 20px;
           border: 0; border-radius: 8px; background: #5b6cff; color: #ffffff; }
  #status { font-size: 13px; color: #6b7280; margin-top: 18px; }
</style>
</head>
<body>
<div class="page">
  <h1 id="h">Focus form</h1>
  <p class="hint">Used by <code>scripts/focus-probe.mjs</code>: click a field, type, and read the
     value back over CDP. The page records every key it receives so the probe can tell the
     difference between "the keyboard reached the page" and "the field happened to be filled".</p>
  <form id="form" action="/form.html" method="get">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="off" spellcheck="false">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="off" spellcheck="false">
    <button type="submit" id="submit">Submit</button>
  </form>
  <p id="status">no keys yet</p>
</div>
<script>
  // Deliberately minimal: no focus() calls, no synthetic input, nothing that
  // could fill a field without a real key event arriving from the browser.
  window.__keys = [];
  window.__submits = 0;
  var status = document.getElementById('status');
  document.addEventListener('keydown', function (event) {
    window.__keys.push(event.key);
    status.textContent = 'keys: ' + window.__keys.join(' ');
  });
  document.getElementById('form').addEventListener('submit', function (event) {
    event.preventDefault();
    window.__submits += 1;
    document.getElementById('h').textContent = 'submitted ' + window.__submits;
  });
</script>
</body>
</html>
