<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rook icon.

  The app is one window with a dark space sidebar on the left: that is what this
  draws, in the app's own palette (sidebar #17181d, avatar chips #5b6cff /
  #e0734a / #2fa27c, tab strip #e6e8ef). Geometry is on a 256 grid and stays
  readable down to 48 px: a light page inside a dark frame, a dark rail with
  three coloured space dots, an active tab.

  Original artwork for this repository; no third-party marks.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="window">
      <rect x="40" y="56" width="176" height="144" rx="14"/>
    </clipPath>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d24"/>
      <stop offset="1" stop-color="#131419"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#tile)"/>
  <rect x="6.75" y="6.75" width="242.5" height="242.5" rx="55.25"
        fill="none" stroke="#2b2e38" stroke-width="1.5"/>

  <!-- window: page on the right, space rail on the left -->
  <g clip-path="url(#window)">
    <rect x="40" y="56" width="176" height="144" fill="#f5f6fa"/>
    <!-- tab strip -->
    <rect x="40" y="56" width="176" height="24" fill="#e6e8ef"/>
    <rect x="98" y="61" width="48" height="15" rx="5" fill="#ffffff"/>
    <rect x="104" y="66.5" width="30" height="4" rx="2" fill="#dfe3ec"/>
    <rect x="152" y="66.5" width="18" height="4" rx="2" fill="#cfd4e0"/>
    <!-- space rail -->
    <rect x="40" y="56" width="58" height="144" fill="#1f212a"/>
    <!-- space dots: you, agent, agent -->
    <circle cx="69" cy="98" r="9" fill="#5b6cff"/>
    <circle cx="69" cy="126" r="9" fill="#e0734a"/>
    <circle cx="69" cy="154" r="9" fill="#2fa27c"/>
    <!-- page content -->
    <rect x="110" y="98" width="92" height="7" rx="3.5" fill="#dfe3ec"/>
    <rect x="110" y="116" width="72" height="7" rx="3.5" fill="#e7eaf1"/>
    <rect x="110" y="134" width="84" height="7" rx="3.5" fill="#e7eaf1"/>
    <rect x="110" y="158" width="40" height="10" rx="5" fill="#2fa27c" opacity="0.9"/>
    <rect x="158" y="158" width="26" height="10" rx="5" fill="#d8dde8"/>
  </g>
  <rect x="40" y="56" width="176" height="144" rx="14"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
</svg>
