<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Northwind</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f7f8fb; color: #14161c;
         font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 380px; margin: 64px auto; background: #fff; border: 1px solid #e4e7ee;
          border-radius: 12px; padding: 28px 28px 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 20px; color: #6b7280; font-size: 13px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #4b5060; margin: 14px 0 5px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 9px 11px; font: inherit;
    border: 1px solid #d6dae4; border-radius: 8px; background: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 20px; }
  .row label { margin: 0; font-weight: 500; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px;
           border: 1px solid transparent; cursor: pointer; }
  button.primary { width: 100%; background: #2b5cff; color: #fff; }
  button.link { background: none; border: 0; color: #2b5cff; padding: 0; font-weight: 500; }
  .foot { margin-top: 18px; padding-top: 16px; border-top: 1px solid #eceef3;
          font-size: 12.5px; color: #7b8090; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>Sign in</h1>
  <p class="sub">Use your Northwind work account.</p>
  <form>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="ada@northwind.example" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" value="hunter2hunter2" autocomplete="current-password">
    <div class="row">
      <label><input type="checkbox" name="remember" checked> Keep me signed in</label>
      <button type="button" class="link">Forgot password?</button>
    </div>
    <button type="submit" class="primary">Sign in</button>
  </form>
  <div class="foot">No account? <a href="#request">Request access</a></div>
</div>
</body>
</html>
